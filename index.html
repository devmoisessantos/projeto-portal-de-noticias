<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Preconnect para o Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Notícias</title>
    <link 
    rel="stylesheet" 
    href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cabeçalho da página | Barras de navegação  -->
    <header>
        <a href="">Link</a>
        <h1>Titulos</h1>
        <h2>Subtítulos</h2>
        <nav id="navbar-primary">
            <div id="logo"></div>
            <div class="manu-item-primary"></div>
            <div class="manu-item-secondary">
                <ul>
                    <li>Inteligência Artificial</li>
                    <li>Blockchain</li>
                    <li>Hologramas</li>
                    <li>Internet</li>
                    <li>Vestíveis</li>
                    <li>Realidade Aumentada</li>
                    <li>Realidade  Virtual</li>
                </ul>
            </div>
        </nav>
        <nav id="navbar-secondary">
            <div id="nav-buttons"></div>
        </nav>
    </header>

    <!-- Conteúdo da página -->
    <div class="container">

        <!-- Conteúdo principal | Abordando notícias -->
        <main id="">
            <div id="features">
                <article id="featured-news-highlight"></article>
                <article id="featured-news"></article>
            </div>
        </main>

        <!-- Seção com as notícias mais lidas -->
        <section id="most-read">
            <div class="heading">
                <p>Mais lidas da semana</p>
                <a href="#" class="button">Ver tudo</a>
            </div>
            <div class="news"></div>
        </section>

        <!-- Conteúdo principal | Destaques de IA -->
        <section id="main-section">
            <div class="heading"></div>
            <div class="news"></div>
        </section>

        <!-- Conteudo Lateral -->
        <aside id="sidebar">
            <div id="ads"></div>
            <div id="related-links"></div>
        </aside>

        <!-- Rodapé da página -->
        <footer id="rodape">
            <p>&copy; 2025 Portal de Notícias. Todos os direitos reservados.</p>
        </footer>
    </div>
</body>
</html>
